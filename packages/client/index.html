    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #dff0ff;
        overflow: hidden;
        font-family: "Sarabun", system-ui, -apple-system, "Segoe UI", "Leelawadee UI", sans-serif;
        color: #22303f;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
    </style>
  </head>
